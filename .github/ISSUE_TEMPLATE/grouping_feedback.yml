name: Grouping or naming feedback
description: Collections, folder names or file names Sheaf proposed were wrong or surprising
labels: ["quality"]
body:
  - type: markdown
    attributes:
      value: |
        This is the most useful feedback for improving Sheaf. **Describe the files, do not attach them.** For example "two rent receipts and a lease ended up in different collections".
  - type: textarea
    id: did
    attributes:
      label: What did Sheaf do?
      description: Which files were grouped, named or moved, and how.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind of problem
      options:
        - Files in the wrong collection
        - Related files split apart
        - Unrelated files grouped together
        - Collection name was poor
        - Suggested file name was poor
        - Other
  - type: input
    id: version
    attributes:
      label: Sheaf version
  - type: input
    id: models
    attributes:
      label: Models in use
      description: The output of `ollama list`.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have not included personal files or their contents.
          required: true
