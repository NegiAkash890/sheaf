name: Feature request
description: Suggest an idea or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or situation matters more than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Sheaf to do?
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
